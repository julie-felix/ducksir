target_velocity:
  label: {en: Forward speed, zh: 前进速度}
  default: 0
  range: [0, 1]
  step: 0.1
  unit: m/s

target_lateral_velocity:
  label: {en: Lateral speed, zh: 横向速度}
  default: 0
  range: [-1, 1]
  step: 0.1
  unit: m/s

target_yaw_rate:
  label: {en: Yaw rate, zh: 转向速度}
  default: 0
  range: [-1, 1]
  step: 0.1
  unit: rad/s

speed_mode:
  label: {en: Speed mode, zh: 速度档位}
  default: 1
  range: [1, 1]
  step: 1
