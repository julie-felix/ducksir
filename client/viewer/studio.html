<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ducksir · 工作台</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0b0f14; --panel:#121820; --panel2:#0e151d; --line:#22303f; --line2:#2b3a4b;
    --ink:#d7dde5; --dim:#8b98a8; --accent:#4da3ff; --ok:#63d18a; --bad:#e5675f; --warn:#e6b45f;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100dvh; overflow:hidden; background:var(--bg); color:var(--ink);
               font:13px/1.5 system-ui,-apple-system,"Noto Sans CJK SC",sans-serif; }
  #app { display:grid; grid-template-columns: 220px 1fr 52px; grid-template-rows: 40px 1fr;
         height:100dvh; }
  /* ── 顶栏 ── */
  #top { grid-column:1/-1; display:flex; align-items:center; gap:10px; padding:0 12px;
         border-bottom:1px solid var(--line); background:var(--panel2); }
  #top .name { font-weight:600; }
  #top .dot { width:7px; height:7px; border-radius:50%; background:var(--ok); }
  #top .grow { flex:1; }
  #top .pill { color:var(--dim); font-size:12px; border:1px solid var(--line); border-radius:999px;
               padding:2px 9px; }
  /* ── 左：文件树 ── */
  #files { border-right:1px solid var(--line); background:var(--panel); overflow:auto; padding:8px 6px; }
  #files .h { color:var(--dim); font-size:11.5px; padding:4px 8px; }
  #files button { display:block; width:100%; text-align:left; background:none; border:0; color:var(--ink);
                  font:inherit; padding:5px 8px; border-radius:6px; cursor:pointer; white-space:nowrap;
                  overflow:hidden; text-overflow:ellipsis; }
  #files button:hover { background:#1a2431; }
  #files button.on { background:#1b2b3d; color:#cfe3ff; }
  #files .ext { color:var(--dim); font-size:11px; margin-left:4px; }
  /* ── 中：3D + 文件内容 ── */
  #mid { display:grid; grid-template-rows: 1fr; position:relative; min-width:0; }
  #view { position:relative; min-height:0; }
  #c { display:block; width:100%; height:100%; touch-action:none; }
  #code { display:none; overflow:auto; background:var(--panel2); padding:12px 14px; font-family:var(--mono);
          font-size:12px; line-height:1.6; white-space:pre; }
  #code.on { display:block; }
  #view.off { display:none; }
  #keys { position:absolute; left:50%; transform:translateX(-50%); bottom:10px; display:flex; gap:6px;
          flex-wrap:wrap; justify-content:center; background:rgba(10,15,22,.82); border:1px solid var(--line);
          border-radius:10px; padding:6px 10px; font-size:11.5px; max-width:calc(100% - 20px); }
  #keys kbd { background:#1b2531; border:1px solid var(--line2); border-radius:4px; padding:0 4px; }
  /* ── 底部：参数 / 指标 / 诊断 ── */
  #bottom { grid-column:1/3; border-top:1px solid var(--line); background:var(--panel);
            display:flex; flex-direction:column; min-height:0; }
  #tabs { display:flex; gap:2px; padding:0 8px; border-bottom:1px solid var(--line); }
  #tabs button { background:none; border:0; border-bottom:2px solid transparent; color:var(--dim);
                 font:inherit; padding:8px 12px; cursor:pointer; }
  #tabs button.on { color:var(--ink); border-bottom-color:var(--accent); }
  .tabpane { display:none; padding:12px 14px; overflow:auto; }
  .tabpane.on { display:block; }
  .row { display:grid; grid-template-columns: 110px 1fr 90px; align-items:center; gap:12px; margin:6px 0; }
  .row label { color:var(--dim); }
  .row output { font-variant-numeric:tabular-nums; text-align:right; }
  input[type=range] { width:100%; accent-color: var(--accent); }
  table { border-collapse:collapse; width:100%; font-size:12.5px; }
  th, td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; width:180px; }
  /* ── 右栏 ── */
  #rail { border-left:1px solid var(--line); background:var(--panel2); display:flex;
          flex-direction:column; align-items:center; gap:4px; padding:8px 0; }
  #rail button { width:40px; height:40px; border-radius:10px; border:1px solid transparent;
                 background:none; color:var(--dim); font-size:11px; cursor:pointer; }
  #rail button.on { background:#1b2b3d; color:#cfe3ff; border-color:var(--line2); }
  #hud { position:absolute; top:10px; left:10px; background:rgba(10,15,22,.82); border:1px solid var(--line);
         border-radius:10px; padding:7px 10px; font-size:12px; font-variant-numeric:tabular-nums; }
  #hud b { font-weight:600; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  @media (max-width: 820px) {
    #app { grid-template-columns: 0 1fr 0; }
    #files, #rail { display:none; }
    #bottom { grid-column:1/-1; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="name">ducksir</span><span class="dot"></span>
    <input id="project-path" value="sim/test/fixtures/project_demo.py" spellcheck="false"
           style="background:#0e151d;border:1px solid var(--line2);color:var(--ink);border-radius:8px;
                  padding:4px 8px;font:inherit;font-size:12px;width:min(42vw,320px)" />
    <button id="btn-start" type="button"
            style="background:#1b6e3f;border:1px solid #2f8f57;color:#e8fff1;border-radius:8px;
                   padding:4px 12px;font:inherit;cursor:pointer">启动仿真</button>
    <button id="btn-stop" type="button"
            style="background:#2a1b1b;border:1px solid #7a3b3b;color:#ffd9d9;border-radius:8px;
                   padding:4px 12px;font:inherit;cursor:pointer">停止</button>
    <span class="grow"></span>
    <span id="conn" class="pill">未连接</span>
  </div>

  <div id="files">
    <div class="h">项目文件</div>
  </div>

  <div id="mid">
    <div id="view">
      <canvas id="c"></canvas>
      <div id="hud"><b>实时跟随</b><div id="hud-line">等第一帧…</div></div>
      <div id="keys">
        <span><kbd>W</kbd>/<kbd>S</kbd> 前进</span><span><kbd>A</kbd>/<kbd>D</kbd> 转向</span>
        <span>拖鼠标转视角</span>
      </div>
    </div>
    <pre id="code"></pre>
  </div>

  <div id="bottom">
    <div id="tabs">
      <button class="on" data-tab="params">参数</button>
      <button data-tab="metrics">指标</button>
      <button data-tab="diag">诊断</button>
    </div>
    <div class="tabpane on" id="pane-params">
      <div class="row">
        <label>前进速度</label>
        <input id="forward" type="range" min="-0.2" max="0.25" step="0.01" value="0" />
        <output id="forward-v">0.00 m/s</output>
      </div>
      <div class="row">
        <label>转向速度</label>
        <input id="yaw" type="range" min="-1" max="1" step="0.05" value="0" />
        <output id="yaw-v">0.00 rad/s</output>
      </div>
    </div>
    <div class="tabpane" id="pane-metrics">
      <table id="metrics"></table>
    </div>
    <div class="tabpane" id="pane-diag">
      <table id="diag"></table>
    </div>
  </div>

  <div id="rail">
    <button class="on" data-rail="view">仿真</button>
    <button data-rail="code">代码</button>
    <button data-rail="metrics">指标</button>
    <button data-rail="diag">诊断</button>
  </div>
</div>
<script>
  // 同一份页面在两处跑：面板（/ducksir-static/…）与 runner 直开（/）
  (function () {
    var inPanel = location.pathname.indexOf('/ducksir-static/') === 0;
    var base = inPanel ? '/ducksir-static/client/viewer/' : '/static/';
    var map = document.createElement('script');
    map.type = 'importmap';
    map.textContent = JSON.stringify({
      imports: { three: base + 'vendor/three/three.module.js', 'three/addons/': base + 'vendor/three/' }
    });
    document.head.appendChild(map);
    var mod = document.createElement('script');
    mod.type = 'module';
    mod.src = base + 'studio.js';
    document.head.appendChild(mod);
  })();
</script>
</body>
</html>
