<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f14" />
<meta name="mobile-web-app-capable" content="yes" />
<title>ducksir · 浏览器里开鸭子</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f14;
    --panel: rgba(10, 15, 22, .82);
    --line: #1f2a36;
    --line2: #2b3a4b;
    --ink: #d7dde5;
    --dim: #8b98a8;
    --accent: #4da3ff;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100dvh; background: var(--bg); color: var(--ink);
    font: 14px/1.55 system-ui, -apple-system, "Noto Sans CJK SC", sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  }
  #c { display: block; width: 100%; height: 100dvh; touch-action: none; }

  /* ── 顶部状态卡 ── */
  #hud {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(10px + var(--safe-l));
    padding: 9px 12px; border-radius: 12px; background: var(--panel);
    border: 1px solid var(--line); backdrop-filter: blur(8px);
    font-variant-numeric: tabular-nums; max-width: min(78vw, 340px);
    display: flex; flex-direction: column; gap: 2px;
  }
  #hud .title { font-weight: 600; font-size: 13px; }
  #hud .line { font-size: 12.5px; color: var(--ink); }
  #hud .sub { font-size: 11.5px; color: var(--dim); }
  #hud select {
    margin-top: 6px; width: 100%; font: inherit; font-size: 13px; color: var(--ink);
    background: #1b2531; border: 1px solid var(--line2); border-radius: 9px;
    padding: 7px 8px; appearance: none;
  }

  /* ── 底部操作区 ── */
  #dock {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px calc(10px + var(--safe-r)) calc(10px + var(--safe-b)) calc(10px + var(--safe-l));
    background: linear-gradient(to top, rgba(11,15,20,.96) 55%, rgba(11,15,20,0));
    display: flex; flex-direction: column; gap: 8px;
  }
  .row { display: flex; gap: 8px; }
  .row > button { flex: 1; }
  #dock button {
    min-height: 46px; border-radius: 12px; border: 1px solid var(--line2);
    background: #1b2531; color: var(--ink); font: inherit; font-size: 14px;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    touch-action: manipulation; transition: border-color .12s, background .12s, transform .06s;
  }
  #dock button:active, #dock button.held { border-color: var(--accent); background: #22303f; }
  #dock button:active { transform: scale(.985); }
  #dock button.wide { flex: 1.4; }
  #dock button.ghost { background: #151c24; color: var(--dim); font-size: 12.5px; min-height: 38px; }
  #hint { font-size: 11.5px; color: var(--dim); text-align: center; }
  kbd { background: #1b2531; border: 1px solid var(--line2); border-radius: 4px; padding: 0 4px; font-size: 11px; }

  /* ── 载入遮罩 ── */
  #busy {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--dim); text-align: center; font-size: 13.5px;
    z-index: 10; transition: opacity .2s;
  }
  #busy.gone { opacity: 0; pointer-events: none; }
  .ok { color: #63d18a; } .warn { color: #e6b45f; } .bad { color: #e5675f; }

  /* 触屏设备：不显示键盘提示 */
  @media (hover: none) and (pointer: coarse) { #hint { display: none; } }

  /* 窄屏：状态卡更紧凑，按钮两行放 */
  @media (max-width: 520px) {
    #hud { max-width: calc(100vw - 20px); padding: 7px 9px; }
    #hud .title { display: none; }          /* 窄屏先让位给数据 */
    #hud .line { font-size: 12px; }
    #dock { padding: 8px calc(8px + var(--safe-r)) calc(8px + var(--safe-b)) calc(8px + var(--safe-l)); gap: 6px; }
    #dock button { font-size: 13.5px; min-height: 54px; }
    #dock button span { display: none; }     /* 只留图标 + 主字 */
    #dock button.wide span { display: inline; }
    .row { gap: 6px; }
  }

  /* 横屏矮屏：把状态卡压扁，按钮一行 */
  @media (max-height: 460px) and (orientation: landscape) {
    #hud { padding: 6px 10px; gap: 0; }
    #hud .title { display: none; }
    #hud select { margin-top: 3px; padding: 4px 6px; }
    #dock { flex-direction: row; align-items: center; gap: 8px; }
    #dock .row { flex: 1; }
    #dock button { min-height: 40px; font-size: 13px; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="title">浏览器里跑物理 + 推理</div>
  <div class="line" id="stat">载入中…</div>
  <div class="line" id="vx">vx 0.00 · yaw 0.00</div>
  <div class="sub" id="perf"></div>
  <select id="policy" aria-label="选择策略"></select>
</div>

<div id="dock">
  <div class="row">
    <button id="btn-left" type="button">↰<span>左转</span></button>
    <button id="btn-slow" type="button">−<span>慢</span></button>
    <button id="btn-fast" type="button" class="wide">+<span>快</span></button>
    <button id="btn-right" type="button">↱<span>右转</span></button>
  </div>
  <div class="row">
    <button id="btn-sit" type="button">坐 / 站</button>
    <button id="btn-kick" type="button">踢腿</button>
    <button id="btn-roll" type="button">翻滚</button>
    <button id="btn-reset" type="button" class="ghost wide">复位</button>
  </div>
  <div id="hint">
    <kbd>W</kbd>/<kbd>S</kbd> 前进 ±0.05（上限 0.25）· <kbd>A</kbd>/<kbd>D</kbd> 转向 ·
    <kbd>X</kbd> 坐/站 · <kbd>Z</kbd> 左踢 · <kbd>C</kbd> 右踢 · <kbd>V</kbd> 翻滚 · <kbd>B</kbd> 拾取 · <kbd>R</kbd> 复位
  </div>
</div>

<div id="busy">载入 MuJoCo / 执行核 / ORT Web…</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/" } }
</script>
<script type="module" src="./play.js"></script>
</body>
</html>
