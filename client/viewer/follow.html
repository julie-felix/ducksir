<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ducksir · 实时跟随</title>
<style>
  :root { color-scheme: dark; --bg:#0b0f14; --line:#1f2a36; --ink:#d7dde5; --dim:#8b98a8; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100dvh; overflow:hidden; background:var(--bg); color:var(--ink);
               font:13px/1.5 system-ui,-apple-system,"Noto Sans CJK SC",sans-serif; }
  #c { display:block; width:100%; height:100dvh; touch-action:none; }
  #hud { position:fixed; left:calc(10px + env(safe-area-inset-left)); top:calc(10px + env(safe-area-inset-top));
         padding:8px 11px; border-radius:10px; background:rgba(10,15,22,.82);
         border:1px solid var(--line); font-variant-numeric:tabular-nums; font-size:12.5px; }
  #hud .t { font-weight:600; margin-bottom:2px; }
  #hud .s { color:var(--dim); }
  #msg { position:fixed; inset:0; display:grid; place-items:center; color:var(--dim); font-size:13px;
         text-align:center; padding:24px; }
  #msg.gone { display:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="t">实时跟随</div>
  <div class="s" id="stat">等第一帧…</div>
</div>
<div id="msg">连显示服务…</div>

</body>
</html>
