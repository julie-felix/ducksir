<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ducksir · 实验台</title>
<style>
  :root { color-scheme: dark; --bg:#0b0f14; --panel:#121a23; --line:#22303f; --ink:#d7dde5;
          --dim:#8b98a8; --ok:#63d18a; --bad:#e5675f; --warn:#e6b45f; --accent:#4da3ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.6 system-ui,-apple-system,"Noto Sans CJK SC",sans-serif;
         padding: calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom)); }
  h1 { font-size:16px; margin:0 0 2px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:14px; }
  h2 { font-size:13px; color:var(--dim); font-weight:600; margin:20px 0 8px; letter-spacing:.02em; }
  .grid { display:grid; gap:8px; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .card .k { color:var(--dim); font-size:11.5px; }
  .card .v { font-size:19px; font-variant-numeric:tabular-nums; margin-top:2px; }
  .card .v small { font-size:11px; color:var(--dim); margin-left:3px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  td, th { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; }
  pre { background:#0e151d; border:1px solid var(--line); border-radius:10px; padding:12px;
        overflow:auto; line-height:1.5; }
  .kv code { color:#a9c7ff; }
  #busy { color:var(--dim); }
</style>
</head>
<body>
<h1>实验台</h1>
<div class="sub">读一次运行的报告，把判据摊开：指标 / 校验 / 摘要链 / 调用方式。</div>
<div id="busy">载入报告…</div>

<div id="content" hidden>
  <h2>面板指标（schema 固定 8 项）</h2>
  <div class="grid" id="metrics"></div>

  <h2>判据</h2>
  <table id="verdict"></table>

  <h2>这次跑的是什么</h2>
  <table class="kv" id="ids"></table>

  <h2>Python 里怎么用</h2>
  <pre id="snippet"></pre>
</div>

<script type="module" src="./inspect.js"></script>
</body>
</html>
