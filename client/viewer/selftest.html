<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ducksir · 自检</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:14px; background:#0b0f14; color:#d7dde5;
         font:13px/1.6 system-ui,-apple-system,"Noto Sans CJK SC",sans-serif; }
  h1 { font-size:15px; margin:0 0 4px; }
  .sub { color:#8b98a8; font-size:12px; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid #22303f; vertical-align:top; }
  th { color:#8b98a8; font-weight:500; width:180px; }
  .ok { color:#63d18a; } .bad { color:#e5675f; } .warn { color:#e6b45f; }
  code { font-family: ui-monospace, Menlo, monospace; font-size:11.5px; word-break:break-all; }
  pre { background:#0e151d; border:1px solid #22303f; border-radius:8px; padding:10px;
        white-space:pre-wrap; word-break:break-all; font-size:11.5px; }
  button { background:#1b6e3f; border:1px solid #2f8f57; color:#e8fff1; border-radius:8px;
           padding:8px 14px; font:inherit; margin:6px 0; }
</style>
</head>
<body>
<h1>自检</h1>
<div class="sub">这一步只验证「页面能不能跑、接口通不通」，不加载 three.js。把这张表截图发我就够定位。</div>
<table id="rows"></table>
<button id="run">在工作台 iframe 里点「启动仿真」</button>
<button id="imp">动态 import studio.js（只测 module 链）</button>
<pre id="out">（未执行）</pre>

<script>
  // 故意用**普通 script**（不是 module）：即使 module 整条链坏了，这一页也能跑起来报告问题。
  const rows = document.getElementById('rows');
  const out = document.getElementById('out');
  const add = (k, v, cls) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<th>${k}</th><td class="${cls || ''}">${v}</td>`;
    rows.appendChild(tr);
  };
  const IN_PANEL = location.pathname.indexOf('/ducksir-static/') === 0;
  const API = IN_PANEL ? '/ducksir-live' : '';

  add('页面版本', '2026-11-11 01:10');
  add('页面地址', `<code>${location.pathname}${location.search}</code>`);
  add('判定', IN_PANEL ? '面板内 → API=/ducksir-live' : '直开 → API=根路径', 'ok');
  add('浏览器', navigator.userAgent.slice(0, 90));

  const errs = [];
  window.addEventListener('error', (e) => { errs.push('error: ' + (e.message || e)); render(); });
  window.addEventListener('unhandledrejection', (e) => { errs.push('reject: ' + (e.reason?.message || e.reason)); render(); });
  function render() { add('捕获的错误', errs.length ? `<code>${errs.join('<br>')}</code>` : '（无）', errs.length ? 'bad' : 'ok'); }

  async function probe(label, url, wantType) {
    try {
      const res = await fetch(url);
      const ct = res.headers.get('content-type') || '';
      const text = res.ok ? await res.text() : '';
      const typeOk = !wantType || ct.includes(wantType);
      add(label, `${res.status} · <code>${ct}</code> · ${text.length} B`,
          res.ok && typeOk ? 'ok' : 'bad');
      return res.ok && typeOk;
    } catch (e) {
      add(label, `请求失败：<code>${e.message || e}</code>`, 'bad');
      return false;
    }
  }

  (async () => {
    await probe('后端 /status', API + '/status', 'json');
    await probe('studio.js', './studio.js', 'javascript');
    await probe('three.module.js', './vendor/three/three.module.js', 'javascript');
    await probe('OrbitControls.js', './vendor/three/controls/OrbitControls.js', 'javascript');
    await probe('GLTFLoader.js', './vendor/three/loaders/GLTFLoader.js', 'javascript');
    await probe('duck-hd1910.json', './data/duck-hd1910.json', 'json');
    await probe('一个 GLB', '../../assets/microduck/trunk_base.glb', '');
    add('importmap 支持', HTMLScriptElement.supports && HTMLScriptElement.supports('importmap')
        ? '支持' : '不支持（旧浏览器，module 里 import "three" 会失败）',
        HTMLScriptElement.supports && HTMLScriptElement.supports('importmap') ? 'ok' : 'bad');
    render();
    probeStudio();     // 自动跑：把工作台塞进 iframe 读它自报的状态
  })();

  // 本页没有 module 脚本，所以**可以**先注入 importmap 再动态 import ——
  // 否则只会得到「Failed to resolve module specifier "three"」：那是本页没有 map，不是 studio 的问题。
  async function injectStudioImportMap() {
    const html = await (await fetch('./studio.html')).text();
    const m = html.match(/<script type="importmap">([\s\S]*?)<\/script>/);
    if (!m) return '（studio.html 里没找到 importmap）';
    const el = document.createElement('script');
    el.type = 'importmap';
    el.textContent = m[1];
    document.head.appendChild(el);
    return m[1].replace(/\s+/g, ' ').slice(0, 140);
  }

  // 真·端到端：在 iframe 里点「启动仿真」，等 6 秒，读它顶栏 + 后端 status。
  // 这一条能直接回答「点了启动到底发生了什么」。
  document.getElementById('run').onclick = async () => {
    out.textContent = '在 iframe 里点启动仿真…';
    const fr = document.createElement('iframe');
    fr.style.cssText = 'width:min(100%,520px);height:320px;border:1px solid #22303f;border-radius:8px;margin-top:8px';
    fr.src = './studio.html?embed=1&_=run';
    document.body.appendChild(fr);
    await new Promise((r) => setTimeout(r, 3500));
    try {
      const doc = fr.contentDocument;
      const btn = doc && doc.getElementById('btn-start');
      if (!btn) throw new Error('iframe 里找不到「启动仿真」按钮');
      btn.click();
      out.textContent += '\n已点击，等 6 秒…';
      await new Promise((r) => setTimeout(r, 6000));
      const conn = doc.getElementById('conn');
      const st = await (await fetch(API + '/status')).json();
      out.textContent += `\n工作台顶栏：${conn ? conn.textContent : '（读不到）'}`
        + `\n后端 status：${JSON.stringify(st)}`;
    } catch (e) {
      out.textContent += '\n失败：' + (e && (e.message || e));
    }
  };

  document.getElementById('imp').onclick = async () => {
    out.textContent = '导入中…';
    try {
      out.textContent = '已注入 importmap：' + (await injectStudioImportMap()) + '\n';
      await import('./studio.js?selftest=1');
      out.textContent += '导入成功：module 链没问题（若工作台仍不动，问题在运行期）';
    } catch (e) {
      out.textContent += '导入失败：' + (e && (e.message || e));
    }
  };

  // 端到端：把 studio 页塞进同源 iframe，4 秒后读它顶栏那行字，
  // 直接回答「工作台到底显示什么」，不用靠人转述。
  async function probeStudio() {
    const fr = document.createElement('iframe');
    fr.style.cssText = 'width:min(100%,520px);height:320px;border:1px solid #22303f;border-radius:8px;margin-top:8px';
    fr.src = './studio.html?embed=1&_=probe';
    document.body.appendChild(fr);
    await new Promise((r) => setTimeout(r, 4000));
    try {
      const doc = fr.contentDocument;
      const conn = doc && doc.getElementById('conn');
      const hud = doc && doc.getElementById('hud-line');
      add('工作台顶栏自报', conn ? `<b>${conn.textContent}</b>` : '（读不到）',
          conn && /已加载|运行中/.test(conn.textContent) ? 'ok' : 'bad');
      if (hud) add('工作台 HUD', hud.textContent);
    } catch (e) {
      add('工作台 iframe 读取', '失败：' + e.message, 'bad');
    }
  }
</script>
</body>
</html>
