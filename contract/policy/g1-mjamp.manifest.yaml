# G1 的 MJAMP（mode 5）：obs 384 = 4 帧 × 96，action 29。
# 逐项对齐 botlab 模板 `g1-wbc` 的 wbc_policy.policies()：
#   mjamp: {history_frames: 4, fields: state_fields(reference, indices=range(29))}   ← q 减 reference、电机序
# 注意：AMP 的观测里**没有**参考段 67 维，只是 4 帧机器人状态；参考只用来算目标角。
kind: ducksir-policy-manifest
version: 1
policy_id: g1-mjamp

model:
  file: build/models/g1-mjamp.onnx
  input: {name: obs, shape: [1, 384]}
  output: {name: actions, shape: [1, 29]}

policies:
  - {key: g1-mjamp, mode: 4, file: build/models/g1-mjamp.onnx}

# 单帧 96：角速度 3 + 投影重力 3 + 速度指令 3 + q29 + qd29 + last29
obs:
  - {slot: body_angvel, len: 3, target: pelvis}
  - {slot: projected_gravity, len: 3, target: pelvis}
  - {slot: velocity_command, len: 3}
  # mjamp 的 q/qd 用**电机序**（policies() 里 indices=list(range(29))）
  - {slot: joint_pos, len: 29, minus: reference, scale: 1.0}
  - {slot: joint_vel, len: 29, scale: 1.0}
  - {slot: last_action, len: 29, scale: 1.0}

# 整个 96 维块展开成 4 帧 → 384
obs_history: {offset: 0, length: 96, frames: 4}

history: {length: 0, layout: by-frame}

action:
  # mode 5：目标 = referenceJointPositions + **逐关节 actionScale** × action（action 已是电机序）
  mapping: default_plus_scale
  order: motor
  clip: ctrlrange

rates: {control_hz: 50, physics_hz: 200, inference_decimation: 4}

provenance:
  source: botlab 模板 g1-wbc · assets/models/Unitree-G1-AMP-Flat_model_30000.onnx（2026-11-12 取）
  upstream: https://botlab.enkeebot.com/templates/g1-wbc/
  obs_layout: wbc_policy.policies() 的 mjamp 条目 —— state_fields(reference) × history 4 帧 = 384
  action_scale: 0.25（统一值，见 wbc_policy.joint_control 的 0.25 * action[motor_order]）
  note: 上游无根 LICENSE；仅本地兼容性对照用，不对外分发。
