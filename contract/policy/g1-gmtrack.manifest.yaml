# G1 的 GMTrack Stage-II（参考动作跟踪）：obs 1728。
# 逐项对齐模板 Unitree-G1-GMTrack-Stage-II-Local/controller.py：
#   proprio 640 = [gravity, pelvis 局部角速度, q−default, qd] × 10（by-term，最老在前）
#   action  290 = last_action × 10（by-term）
#   window  798 = 21 个参考 token（−10…+10 帧），每个 [v_ref(3), w_ref(3), g_ref(3), q_ref(29)]
# 动作：target = q_ref(t+0.02) + scale·action，再按 motor_order 重排。
kind: ducksir-policy-manifest
version: 1
policy_id: g1-gmtrack

model:
  file: build/models/g1-gmtrack.onnx
  input: {name: obs, shape: [1, 1728]}
  output: {name: actions, shape: [1, 29]}

policies:
  - {key: g1-gmtrack, mode: 0, file: build/models/g1-gmtrack.onnx}

obs:
  - {slot: mimic_gmtrack, len: 1728}

history: {length: 0, layout: by-term}

action:
  mapping: reference_plus_scale
  order: policy
  clip: ctrlrange

rates: {control_hz: 50, physics_hz: 200, inference_decimation: 4}

provenance:
  source: botlab 模板 Unitree-G1-GMTrack-Stage-II-Local · assets/models/stage2_actor.onnx（2026-11-14 取）
  upstream: https://botlab.enkeebot.com/templates/unitree-g1-gmtrack-stage-ii-local/
  obs_layout: controller.py 的 640+290+798 = 1728（实测对齐 /tmp/gmtrack.jsonl：命令窗 5e-07、q/qd/action 1e-06）
  reference_lead: t_ref = 控制步×0.02 + 0.02（比控制步领先一帧，模板 REFERENCE_LEAD_S）
  action_scale: 逐关节（0.074 / 0.351 / 0.439 / 0.547）
  note: 上游无根 LICENSE；仅本地兼容性对照用，不对外分发。
