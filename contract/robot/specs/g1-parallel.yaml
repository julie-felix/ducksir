- id: waist_pitch_roll
  kind: parallel_2dof
  mount: pelvis
  platform: torso_link
  charts:
    pr:
      joints:
      - waist_pitch_joint
      - waist_roll_joint
      semantic:
      - pitch
      - roll
    ab:
      motors:
      - ab: A
        index: 13
      - ab: B
        index: 14
  coupling:
    kind: unresolved
    anchor_zero:
      A: 0
      B: 0
      roll: 0
      pitch: 0
    todo: 腰部连杆与踝不同构，且没有腰部 CAD；映射不能照抄踝
presets:
  ab:
    chart: ab
    note: 切到 AB 坐标后，动作向量里的 4/5、10/11、13/14 被解释成两个电机的角度；限位与驱动仍按 PR 关节定义
