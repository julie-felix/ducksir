# G1 的并联机构（手写，不是导入产物）
#
# 这份文件描述的是**同一台机器的另一套坐标**，不是另一台机器：
#   官方 URDF/MJCF 只有 PR（串联等效）：pitch → roll 两个关节。
#   实物是并联：两个电机（A/B）经连杆驱动一块平台，平台有 2 个自由度。
#   SDK 的 mode_pr 在 PR/AB 之间切换「这两个电机怎么被解释」。
#
# 索引取自 unitree_mujoco 的 g1_joint_index_dds.md（29DOF 表，mode 0 = PR，mode 1 = AB）：
#   4 = L_LEG_ANKLE_PITCH / L_LEG_ANKLE_B      5 = L_LEG_ANKLE_ROLL / L_LEG_ANKLE_A
#  10 = R_LEG_ANKLE_PITCH / R_LEG_ANKLE_B     11 = R_LEG_ANKLE_ROLL / R_LEG_ANKLE_A
#  13 = WAIST_ROLL / WAIST_A                  14 = WAIST_PITCH / WAIST_B
# 规律：A ↔ roll，B ↔ pitch。
#
# coupling 一律 unresolved：官方文档明说 AB 模式「需自行计算并联机构运动学」，
# 也就是说宇树没有公开这条映射。这里把「欠一条映射」写进实体，而不是假装知道。

type: g1-29dof
source: https://support.unitree.com/home/zh/G1_developer/basic_motion_routine
source_index: https://github.com/unitreerobotics/unitree_mujoco/blob/main/unitree_robots/g1/g1_joint_index_dds.md
cad:
  url: https://oss-global-cdn.unitree.com/static/6b15e9e64db64c57970f9fbd6e51c60f.zip
  file: G1脚踝并联结构.stp
  format: STEP AP214 / NX 11
  units: mm
  note: 7 个实体、无装配树、无零件名；按包围盒判读见 docs/plans/2026-11-09-parallel-mechanism.md
  redistributable: unknown

mechanisms:
  - id: ankle_left
    kind: parallel_2dof
    mount: left_knee_link
    platform: left_ankle_roll_link
    charts:
      pr:
        joints: [left_ankle_pitch_joint, left_ankle_roll_joint]
        semantic: [pitch, roll]
      ab:
        motors:
          - {ab: B, index: 4, note: 同一槽位在 PR 模式下叫 L_LEG_ANKLE_PITCH}
          - {ab: A, index: 5, note: 同一槽位在 PR 模式下叫 L_LEG_ANKLE_ROLL}
    coupling:
      kind: unresolved
      anchor_zero: {A: 0.0, B: 0.0, roll: 0.0, pitch: 0.0}
      todo: 需要连杆几何（CAD 无装配树）+ 真机扫点标定，才谈得上解析解或查表

  - id: ankle_right
    kind: parallel_2dof
    mount: right_knee_link
    platform: right_ankle_roll_link
    charts:
      pr:
        joints: [right_ankle_pitch_joint, right_ankle_roll_joint]
        semantic: [pitch, roll]
      ab:
        motors:
          - {ab: B, index: 10}
          - {ab: A, index: 11}
    coupling:
      kind: unresolved
      anchor_zero: {A: 0.0, B: 0.0, roll: 0.0, pitch: 0.0}
      todo: 同 ankle_left；左右是否镜像未核实

  - id: waist_pitch_roll
    kind: parallel_2dof
    mount: pelvis
    platform: torso_link
    charts:
      pr:
        joints: [waist_pitch_joint, waist_roll_joint]
        semantic: [pitch, roll]
      ab:
        motors:
          - {ab: A, index: 13}
          - {ab: B, index: 14}
    coupling:
      kind: unresolved
      anchor_zero: {A: 0.0, B: 0.0, roll: 0.0, pitch: 0.0}
      todo: 腰部连杆与踝不同构，映射不能照抄踝

presets:
  ab:
    chart: ab
    note: 切到 AB 坐标后，动作向量里的 4/5、10/11、13/14 被解释成两个电机的角度；限位与驱动仍按 PR 关节定义
