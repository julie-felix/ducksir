name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Shell 语法
        run: |
          bash -n scripts/*.sh
          bash -n .githooks/pre-push

      - name: 仓库骨架与链接
        run: python3 scripts/check-repo.py

      - name: 执行核编译 + blob 自检
        run: |
          if command -v g++ >/dev/null 2>&1; then
            make -C engine
          else
            echo "没有 g++，跳过编译（只跑 blob 自检）"
          fi
          python3 sim/test/test_blob_roundtrip.py

      - name: 钩子拦得住直推 main
        run: |
          if printf 'refs/heads/main 1111 refs/heads/main 2222\n' | .githooks/pre-push origin origin.url; then
            echo "✗ 钩子没拦住直推 main"
            exit 1
          fi
          echo "✓ 直推 main 被拦"

      - name: 钩子放行普通分支
        run: |
          printf 'refs/heads/feat/x 1111 refs/heads/feat/x 0000\n' | .githooks/pre-push origin origin.url
          echo "✓ 普通分支放行"

      - name: UI 单源（键位/区间只许来自契约）
        run: python3 scripts/check-ui-single-source.py

      - name: serve smoke（统一后端 curl 冒烟）
        run: bash tools/dev/serve_smoke.sh

      # ---- 下面是「硬验证」：装不上依赖就 SKIP，装了就必须过 ----
      - name: Python 依赖（对拍/bundle 回归用）
        run: |
          python3 -m pip install --quiet --upgrade pip || true
          python3 -m pip install --quiet numpy pyyaml mujoco || echo "依赖装不上，后面两步会自动 SKIP"

      - name: bundle 端到端回归（跳过需要 EGL 的渲染类）
        env:
          BUNDLE_TEST_SKIP_RENDER: "1"
        run: |
          if python3 -c "import mujoco" 2>/dev/null; then
            python3 sim/test/test_g1_wbc_bundle.py
          else
            echo "SKIP：没有 mujoco"
          fi

      - name: 对拍回归（obs 与 botlab 录制逐段比）
        run: python3 sim/test/test_parity.py

      - name: bundle 评分（低于 8 分就红）
        run: |
          if python3 -c "import mujoco" 2>/dev/null; then
            python3 tools/dev/bundle_eval.py --min 8
          else
            echo "SKIP：没有 mujoco"
          fi

      - name: UI 探针（有 Chrome 才跑）
        run: |
          if command -v google-chrome >/dev/null 2>&1 || command -v chromium >/dev/null 2>&1; then
            bash tools/dev/serve_smoke.sh >/dev/null 2>&1 || true
            echo "跳过：探针需要常驻后端 + 浏览器，CI 里留给人本地跑"
          else
            echo "SKIP：没有 Chrome"
          fi
